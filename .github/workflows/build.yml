name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # secrets 不能直接在 if 条件里引用，放到 job 级 env 再判断
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # release 变体 + R8 裁剪（无 keystore.properties 时自动回退 debug 签名，可直接安装）
      - name: Build release APK + unit tests
        run: ./gradlew assembleRelease testDebugUnitTest --no-daemon

      # 每次 push main 自动更新 nightly Release（预发布，不抢占 releases/latest）
      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --title "Nightly 自动构建" \
            --notes "每次推送 main 自动生成（release 裁剪 + debug 签名，约 2MB）。正式版请用 v* tag 发布。" \
            --prerelease \
            --target main \
            app/build/outputs/apk/release/app-release.apk

      # 打 tag 且配置了签名 secrets 时，构建正式 release 包并附到 Release
      - name: Set up release signing
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > motobsd-release.jks
          cat > keystore.properties <<EOF
          storeFile=motobsd-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        # 只有配置了正式签名 secrets 才发布，避免把 debug 签名回退包当正式版挂上去
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        with:
          files: app/build/outputs/apk/release/app-release.apk
